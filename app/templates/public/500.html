{% extends 'base.html' %}
{% block title %}Server error | Axiom Gateway Consult{% endblock %}
{% block content %}
<section class="py-24 bg-white">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
    <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-amber-50 border border-amber-200 text-amber-700 text-xs sm:text-sm font-semibold tracking-wide uppercase">
      <span class="w-2 h-2 rounded-full bg-amber-600"></span>
      Error 500
    </div>
    <h1 class="mt-6 text-4xl sm:text-5xl font-extrabold text-slate-900">Something went wrong</h1>
    <p class="mt-4 text-lg text-slate-600">We encountered an unexpected issue while processing your request. Please try again or contact us for support.</p>
    <a href="{{ url_for('public.home') }}" class="mt-8 inline-flex items-center justify-center gap-2 px-6 py-3.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold transition-all shadow-md shadow-blue-600/20">
      Return home <i class="fa-solid fa-arrow-right"></i>
    </a>
  </div>
</section>
{% endblock %}
