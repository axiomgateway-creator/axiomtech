{% extends 'admin/layout.html' %}
{% block title %}Upload academy resource{% endblock %}
{% block content %}
<h1>Upload academy resource</h1>
<p>Accepted files: PDF, DOCX, XLSX, PPTX, ZIP, MP4, WEBM. Maximum upload size: 16 MB.</p>
<form method="post" enctype="multipart/form-data" class="admin-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-grid admin-grid">
    <div><label>Title</label><input name="title" maxlength="200" required></div>
    <div><label>URL slug (optional)</label><input name="slug" maxlength="200"></div>
    <div><label>Category</label><input name="category" maxlength="120" value="Digital Resource"></div>
    <div><label>Resource file</label><input name="resource_file" type="file" accept=".pdf,.docx,.xlsx,.pptx,.zip,.mp4,.webm" required></div>
    <div><label>Price</label><input name="price" type="number" min="0" step="0.01" value="0"></div>
    <div><label>Currency</label><select name="currency"><option value="NGN">NGN</option><option value="USD">USD</option></select></div>
    <div class="full-width"><label>Short description</label><textarea name="short_description" rows="3" required></textarea></div>
    <div class="full-width"><label>Description</label><textarea name="description" rows="7" required></textarea></div>
    <div><label><input type="checkbox" name="is_free"> Free resource</label></div>
    <div><label><input type="checkbox" name="publish" checked> Publish resource</label></div>
  </div>
  <button class="btn btn-primary" type="submit">Upload and save</button>
</form>
{% endblock %}
